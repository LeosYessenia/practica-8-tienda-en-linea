<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Tienda - Registro</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
    header { background-color: #131921; color: white; text-align: center; padding: 15px; }
    header h1 { margin: 0; font-size: 24px; }
    nav { background-color: #232f3e; padding: 10px; text-align: center; }
    nav a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
    main { max-width: 900px; margin: 20px auto; padding: 20px; }
    
    .contenedor-formulario { background-color: white; border: 1px solid #ddd; padding: 20px; max-width: 350px; margin: 0 auto; text-align: center; }
    .campo { margin-bottom: 12px; text-align: left; }
    .campo label { display: block; margin-bottom: 5px; font-weight: bold; }
    .campo input { width: 100%; padding: 8px; box-sizing: border-box; }
    
    button { width: 100%; padding: 10px; background-color: #f0c14b; border: 1px solid #a88734; font-weight: bold; cursor: pointer; }
    p { margin-top: 15px; font-size: 14px; }
    footer { background-color: #131921; color: white; text-align: center; padding: 15px; margin-top: 30px; }
  </style>
</head>
<body>

  <header>
    <h1>Mi Tienda en Línea</h1>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="productos.html">Productos</a>
    <a href="ofertas.html">Ofertas</a>
    <a href="masvendido.html">Lo Más Vendido</a>
  </nav>

  <main>
    <div class="contenedor-formulario">
      <h2>Crear Cuenta</h2>
      <form action="#">
        <div class="campo">
          <label>Nombre completo:</label>
          <input type="text" required>
        </div>

        <div class="campo">
          <label>Correo electrónico:</label>
          <input type="email" required>
        </div>

        <div class="campo">
          <label>Teléfono:</label>
          <input type="tel" required>
        </div>

        <div class="campo">
          <label>Dirección:</label>
          <input type="text" required>
        </div>

        <div class="campo">
          <label>Contraseña:</label>
          <input type="password" required>
        </div>

        <button type="submit">Registrarme</button>
      </form>

      <p>¿Ya tienes cuenta? <a href="index.html">Inicia sesión aquí</a></p>
    </div>
  </main>

  <footer>
    <p>NOMBRE: Leos Yessenia</p>
    <p>SEMESTRE Y GRUPO: 5-I</p>
    <p>NUMERO DE CONTROL: 0576</p>
  </footer>

</body>
</html>
