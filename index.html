<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tienda en Línea - Inicio</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    /* Encabezado */
    header {
      background-color: #131921;
      color: white;
      text-align: center;
      padding: 15px;
    }
    header h1 {
      margin: 0;
      font-size: 24px;
    }
    /* Barra de navegación */
    nav {
      background-color: #232f3e;
      padding: 10px;
      text-align: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }

    /* Cuerpo */
    main {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
    }

    /* Formulario de Iniciar Sesión */
    .contenedor-formulario {
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 20px;
      max-width: 350px;
      margin: 0 auto;
    }
    .contenedor-formulario h2 {
      margin-top: 0;
      text-align: center;
    }
    .campo {
      margin-bottom: 12px;
    }
    .campo label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .campo input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #f0c14b;
      border: 1px solid #a88734;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Pie de página */
    footer {
      background-color: #131921;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mi Tienda en Línea</h1>
  </header>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="ropa.html">Ropa</a>
    <a href="electrodomesticos.html">Electrodomesticos</a>
    <a href="juguetes.html">Juguetes</a>
    <a href="aparatose.html">Aparatos electronicos</a>
    <a href="deportes.html">Deportes</a>
  </nav>

  <main>
    <!-- Sección del Formulario -->
    <section class="contenedor-formulario">
      <h2>Iniciar Sesión</h2>
      <form action="#">
        <div class="campo">
          <label for="correo">Correo electrónico:</label>
          <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="campo">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" placeholder="Tu contraseña" required>
        </div>
        
        <button type="submit">Entrar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>NOMBRE: Leos Yessenia</p>
    <p>SEMESTRE Y GRUPO: 5-I</p>
    <p>NUMERO DE CONTROL: 0576</p>
  </footer>

</body>
</html>
